<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Shimpi Jodi — Discover</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --indigo:#1E3548;
  --indigo-70:#4A5F71;
  --teal:#2C6E75;
  --teal-tint:#E8F1F1;
  --coral:#F4633A;
  --coral-tint:#FDEDE7;
  --cream:#FAF7F2;
  --surface:#FFFFFF;
  --ink:#141A1F;
  --muted:#7C868F;
  --line:#E7E3DC;
  --radius:18px;
  --shadow:0 2px 10px rgba(30,53,72,.06);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{background:var(--cream);color:var(--ink);font-family:'Inter',-apple-system,sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;}
button{font-family:inherit;border:none;background:none;cursor:pointer;color:inherit;}
img{display:block;}
.app{max-width:440px;margin:0 auto;min-height:100vh;position:relative;overflow-x:hidden;}

/* Header */
.header{position:sticky;top:0;z-index:40;background:rgba(250,247,242,.94);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;}
.brand{display:flex;align-items:center;gap:9px;}
.brand .mark{width:26px;height:26px;}
.brand .name{font-family:'Baloo 2',sans-serif;font-weight:700;font-size:19px;color:var(--indigo);letter-spacing:-.2px;}
.hdr-actions{display:flex;gap:4px;}
.icon-btn{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;position:relative;transition:background .15s;}
.icon-btn:active{background:var(--teal-tint);}
.icon-btn svg{width:21px;height:21px;stroke:var(--indigo);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;}
.pearl-dot{position:absolute;top:7px;right:8px;width:8px;height:8px;border-radius:50%;background:var(--coral);border:2px solid var(--cream);}
.filter-count{position:absolute;top:5px;right:5px;min-width:15px;height:15px;border-radius:999px;background:var(--teal);color:#fff;font-size:9px;font-weight:700;display:flex;align-items:center;justify-content:center;border:2px solid var(--cream);}

.daily{padding:18px 16px 4px;}
.daily h1{font-family:'Baloo 2',sans-serif;font-size:22px;font-weight:700;margin:0 0 2px;color:var(--indigo);letter-spacing:-.3px;}
.daily p{margin:0;font-size:13px;color:var(--muted);}
.daily .count{color:var(--teal);font-weight:600;}

.feed{padding:14px 16px 104px;display:flex;flex-direction:column;gap:16px;}

/* Card */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);transition:transform .18s;}
.card:active{transform:scale(.988);}
.card-photo{position:relative;height:270px;overflow:hidden;display:flex;align-items:flex-end;background:#DDD8D0;}
.card-photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
.card-photo::after{content:'';position:absolute;inset:0;background:linear-gradient(to top,rgba(15,22,28,.82) 0%,rgba(15,22,28,.18) 44%,transparent 68%);}
.photo-body{position:relative;z-index:2;padding:14px 16px;width:100%;}
.photo-name{font-family:'Baloo 2',sans-serif;font-weight:700;font-size:22px;color:#fff;letter-spacing:-.2px;line-height:1.2;display:flex;align-items:center;gap:7px;}
.verified{width:16px;height:16px;flex-shrink:0;}
.photo-sub{font-size:13px;color:rgba(255,255,255,.88);margin-top:2px;}
.photo-count{position:absolute;top:12px;right:12px;z-index:2;background:rgba(15,22,28,.5);backdrop-filter:blur(6px);color:#fff;font-size:11px;font-weight:500;padding:4px 9px;border-radius:999px;}
.new-badge{position:absolute;top:12px;left:12px;z-index:2;background:var(--coral);color:#fff;font-size:10px;font-weight:700;letter-spacing:.04em;padding:4px 9px;border-radius:999px;text-transform:uppercase;}

.card-body{padding:14px 16px 4px;}
.facts{display:flex;flex-wrap:wrap;gap:7px;}
.fact{display:inline-flex;align-items:center;gap:5px;background:var(--cream);border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-size:12.5px;color:#3B454E;font-weight:500;}
.fact svg{width:13px;height:13px;stroke:var(--teal);fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;}

.prompt{margin:14px 0 4px;padding:13px 14px;background:var(--teal-tint);border-radius:14px;border-left:3px solid var(--teal);}
.prompt .q{font-size:11.5px;color:var(--teal);font-weight:600;text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px;}
.prompt .a{font-size:14px;color:var(--indigo);line-height:1.5;}

.compat{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;}
.compat-chip{font-size:11.5px;font-weight:500;padding:4px 10px;border-radius:999px;display:inline-flex;align-items:center;gap:4px;}
.compat-chip.match{background:var(--coral-tint);color:#B8401C;}
.compat-chip.diff{background:#F2F3F4;color:#6B747C;}
.compat-chip svg{width:11px;height:11px;stroke-width:2.4;fill:none;stroke-linecap:round;stroke-linejoin:round;}
.compat-chip.match svg{stroke:var(--coral);}
.compat-chip.diff svg{stroke:#9BA3AA;}

.card-actions{display:flex;gap:9px;padding:14px 16px 16px;}
.btn{flex:1;border-radius:13px;padding:12px;font-family:'Baloo 2',sans-serif;font-weight:600;font-size:14.5px;display:flex;align-items:center;justify-content:center;gap:7px;transition:transform .12s,background .15s;}
.btn:active{transform:scale(.97);}
.btn-primary{background:var(--coral);color:#fff;}
.btn-primary.sent{background:var(--coral-tint);color:#B8401C;}
.btn-ghost{background:transparent;border:1.5px solid var(--line);color:var(--indigo);flex:0 0 52px;}
.btn-ghost.saved{background:var(--teal-tint);border-color:var(--teal);}
.btn svg{width:17px;height:17px;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.btn-primary svg{stroke:#fff;}
.btn-primary.sent svg{stroke:#B8401C;fill:#B8401C;}
.btn-ghost svg{stroke:var(--indigo-70);}
.btn-ghost.saved svg{stroke:var(--teal);fill:var(--teal);}

/* end of feed */
.feed-end{text-align:center;padding:14px 24px 0;}
.feed-end svg{width:46px;height:46px;margin-bottom:8px;}
.feed-end p{font-size:13.5px;color:var(--muted);margin:0;line-height:1.55;}

/* Bottom nav */
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:440px;z-index:50;background:rgba(255,255,255,.96);backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;padding:8px 6px calc(8px + env(safe-area-inset-bottom));}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 0;position:relative;}
.nav-item svg{width:22px;height:22px;stroke:var(--muted);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;}
.nav-item span{font-size:10px;color:var(--muted);font-weight:500;}
.nav-item.active svg{stroke:var(--indigo);}
.nav-item.active span{color:var(--indigo);font-weight:600;}
.nav-item.active::before{content:'';position:absolute;top:-8px;width:5px;height:5px;border-radius:50%;background:var(--coral);}
.nav-badge{position:absolute;top:2px;right:calc(50% - 18px);min-width:16px;height:16px;padding:0 4px;border-radius:999px;background:var(--coral);color:#fff;font-size:9.5px;font-weight:700;display:flex;align-items:center;justify-content:center;}

/* Sheets */
.backdrop{position:fixed;inset:0;z-index:60;background:rgba(15,22,28,.42);opacity:0;pointer-events:none;transition:opacity .25s;}
.backdrop.open{opacity:1;pointer-events:auto;}
.sheet{position:fixed;bottom:0;left:50%;transform:translate(-50%,100%);width:100%;max-width:440px;height:96vh;z-index:70;background:var(--cream);border-radius:22px 22px 0 0;overflow-y:auto;overscroll-behavior:contain;transition:transform .34s cubic-bezier(.32,.72,0,1);}
.sheet.open{transform:translate(-50%,0);}
.sheet-handle{position:sticky;top:0;z-index:5;background:var(--cream);padding:10px 0 6px;display:flex;justify-content:center;}
.sheet-handle div{width:38px;height:4px;border-radius:999px;background:#D4CFC6;}
.sheet-close{position:absolute;top:14px;right:14px;z-index:8;width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.92);display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow);}
.sheet-close svg{width:16px;height:16px;stroke:var(--indigo);stroke-width:2.2;fill:none;stroke-linecap:round;}

/* photo carousel */
.gallery{margin:0 16px;border-radius:var(--radius);overflow:hidden;position:relative;height:340px;background:#DDD8D0;}
.gallery-track{display:flex;height:100%;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;}
.gallery-track::-webkit-scrollbar{display:none;}
.gallery-track img{min-width:100%;height:100%;object-fit:cover;scroll-snap-align:center;}
.gallery::after{content:'';position:absolute;inset:0;pointer-events:none;background:linear-gradient(to top,rgba(15,22,28,.8) 0%,transparent 52%);}
.gallery-info{position:absolute;bottom:0;left:0;right:0;z-index:3;padding:16px 18px;}
.gallery-info .photo-name{font-size:25px;}
.dots{position:absolute;top:12px;left:0;right:0;z-index:4;display:flex;gap:4px;justify-content:center;padding:0 40px;}
.dot{flex:1;max-width:44px;height:3px;border-radius:999px;background:rgba(255,255,255,.35);transition:background .2s;}
.dot.on{background:#fff;}

.sheet-section{margin:16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);}
.sheet-section h3{font-family:'Baloo 2',sans-serif;font-size:13px;font-weight:600;color:var(--teal);text-transform:uppercase;letter-spacing:.05em;margin:0 0 12px;display:flex;align-items:center;gap:7px;}
.sheet-section h3 svg{width:15px;height:15px;stroke:var(--teal);fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 12px;}
.detail .k{font-size:11px;color:var(--muted);margin-bottom:2px;}
.detail .v{font-size:14px;color:var(--ink);font-weight:500;line-height:1.35;}
.detail.full{grid-column:1/-1;}
.about-text{font-size:14.5px;line-height:1.62;color:#2B333A;}

.compat-row{display:flex;align-items:flex-start;gap:11px;padding:11px 0;border-bottom:1px solid var(--line);}
.compat-row:last-child{border-bottom:none;padding-bottom:0;}
.compat-row:first-of-type{padding-top:0;}
.compat-icon{width:26px;height:26px;border-radius:8px;flex-shrink:0;display:flex;align-items:center;justify-content:center;}
.compat-icon.yes{background:var(--coral-tint);}
.compat-icon.no{background:#F2F3F4;}
.compat-icon svg{width:14px;height:14px;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;}
.compat-icon.yes svg{stroke:var(--coral);}
.compat-icon.no svg{stroke:#9BA3AA;}
.compat-text .t{font-size:14px;font-weight:500;}
.compat-text .s{font-size:12.5px;color:var(--muted);margin-top:1px;}

.prompt-block{background:var(--teal-tint);border-radius:14px;padding:13px 14px;margin-bottom:10px;}
.prompt-block:last-child{margin-bottom:0;}
.prompt-block .q{font-size:11.5px;color:var(--teal);font-weight:600;margin-bottom:4px;}
.prompt-block .a{font-size:14.5px;color:var(--indigo);line-height:1.5;}

.locked-note{display:flex;align-items:center;gap:9px;background:#fff;border:1px dashed var(--line);border-radius:13px;padding:11px 13px;margin:0 16px 16px;font-size:12.5px;color:var(--muted);}
.locked-note svg{width:16px;height:16px;stroke:var(--muted);fill:none;stroke-width:1.8;flex-shrink:0;stroke-linecap:round;stroke-linejoin:round;}
.locked-note b{color:var(--indigo);font-weight:600;}
.sheet-cta{position:sticky;bottom:0;background:linear-gradient(to top,var(--cream) 62%,transparent);padding:16px 16px calc(18px + env(safe-area-inset-bottom));display:flex;gap:9px;}

/* Filter sheet */
.fsheet{position:fixed;bottom:0;left:50%;transform:translate(-50%,100%);width:100%;max-width:440px;max-height:82vh;z-index:75;background:var(--cream);border-radius:22px 22px 0 0;overflow-y:auto;transition:transform .32s cubic-bezier(.32,.72,0,1);}
.fsheet.open{transform:translate(-50%,0);}
.fsheet-head{position:sticky;top:0;background:var(--cream);z-index:3;padding:14px 18px 10px;border-bottom:1px solid var(--line);}
.fsheet-head .bar{width:38px;height:4px;border-radius:999px;background:#D4CFC6;margin:0 auto 12px;}
.fsheet-head .row{display:flex;align-items:center;justify-content:space-between;}
.fsheet-head h2{font-family:'Baloo 2',sans-serif;font-size:19px;font-weight:700;color:var(--indigo);margin:0;}
.fsheet-head button{font-size:13px;color:var(--teal);font-weight:600;}
.fgroup{padding:16px 18px 4px;}
.fgroup h4{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em;margin:0 0 10px;}
.chiprow{display:flex;flex-wrap:wrap;gap:8px;}
.fchip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;font-size:13.5px;font-weight:500;color:#3B454E;transition:all .15s;}
.fchip.on{background:var(--indigo);border-color:var(--indigo);color:#fff;}
.fchip:active{transform:scale(.96);}
.fsheet-cta{position:sticky;bottom:0;background:linear-gradient(to top,var(--cream) 64%,transparent);padding:16px 18px calc(18px + env(safe-area-inset-bottom));}
.fsheet-cta .btn{width:100%;}

/* Interest confirm — the shell/pearl moment */
.confirm{position:fixed;inset:0;z-index:90;display:flex;align-items:center;justify-content:center;padding:28px;opacity:0;pointer-events:none;transition:opacity .22s;background:rgba(15,22,28,.55);backdrop-filter:blur(3px);}
.confirm.open{opacity:1;pointer-events:auto;}
.confirm-box{background:var(--surface);border-radius:24px;padding:30px 24px 22px;text-align:center;max-width:320px;width:100%;transform:scale(.94);transition:transform .28s cubic-bezier(.34,1.4,.5,1);}
.confirm.open .confirm-box{transform:scale(1);}
.confirm-box .shellwrap{width:78px;height:78px;margin:0 auto 14px;}
.confirm-box h3{font-family:'Baloo 2',sans-serif;font-size:20px;font-weight:700;color:var(--indigo);margin:0 0 6px;}
.confirm-box p{font-size:13.5px;color:var(--muted);margin:0 0 18px;line-height:1.55;}
.confirm-box .btn{width:100%;}
.pearl-pop{transform-origin:center;animation:none;}
.confirm.open .pearl-pop{animation:pearlIn .5s .18s cubic-bezier(.34,1.5,.5,1) both;}
@keyframes pearlIn{from{transform:scale(0);opacity:0;}to{transform:scale(1);opacity:1;}}
.valve-l,.valve-r{transform-origin:48px 80px;}
.confirm.open .valve-l{animation:openL .5s cubic-bezier(.4,1.2,.5,1) both;}
.confirm.open .valve-r{animation:openR .5s cubic-bezier(.4,1.2,.5,1) both;}
@keyframes openL{from{transform:rotate(16deg);}to{transform:rotate(0);}}
@keyframes openR{from{transform:rotate(-16deg);}to{transform:rotate(0);}}

.toast{position:fixed;bottom:96px;left:50%;transform:translate(-50%,20px);background:var(--indigo);color:#fff;padding:11px 18px;border-radius:999px;font-size:13.5px;font-weight:500;z-index:88;opacity:0;pointer-events:none;transition:all .25s;display:flex;align-items:center;gap:8px;}
.toast.show{opacity:1;transform:translate(-50%,0);}
.toast .pearl{width:8px;height:8px;border-radius:50%;background:var(--coral);}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01ms!important;}}
</style>
</head>
<body>
<div class="app">
  <header class="header">
    <div class="brand">
      <svg class="mark" viewBox="0 0 96 96">
        <path d="M48 80 C 20 73, 13 42, 27 20" stroke="#2C6E75" stroke-width="7" fill="none" stroke-linecap="round"/>
        <path d="M48 80 C 76 73, 83 42, 69 20" stroke="#1E3548" stroke-width="7" fill="none" stroke-linecap="round"/>
        <circle cx="48" cy="42" r="8.5" fill="#F4633A"/>
      </svg>
      <span class="name">Shimpi Jodi</span>
    </div>
    <div class="hdr-actions">
      <button class="icon-btn" id="filterBtn" aria-label="Filters">
        <svg viewBox="0 0 24 24"><path d="M4 6h16M7 12h10M10 18h4"/></svg>
        <span class="filter-count" id="fCount" style="display:none">0</span>
      </button>
      <button class="icon-btn" aria-label="Notifications">
        <svg viewBox="0 0 24 24"><path d="M18 8a6 6 0 10-12 0c0 5-2 6-2 6h16s-2-1-2-6z"/><path d="M10 20a2 2 0 004 0"/></svg>
        <span class="pearl-dot"></span>
      </button>
    </div>
  </header>

  <div class="daily">
    <h1>Today for you</h1>
    <p><span class="count" id="feedCount">5 profiles</span> · chosen from your filters</p>
  </div>

  <main class="feed" id="feed"></main>

  <nav class="nav">
    <button class="nav-item active"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg><span>Discover</span></button>
    <button class="nav-item"><svg viewBox="0 0 24 24"><path d="M12 21s-7-4.6-9.5-9C.7 8.4 2.8 5 6.2 5c1.9 0 3.3 1 4 2.3.7-1.3 2.1-2.3 4-2.3 3.4 0 5.5 3.4 3.7 7-2.5 4.4-9.5 9-9.5 9z"/></svg><span>Interests</span><span class="nav-badge">3</span></button>
    <button class="nav-item"><svg viewBox="0 0 24 24"><path d="M4 5h16v11H8l-4 4V5z"/></svg><span>Chat</span></button>
    <button class="nav-item"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="5"/><circle cx="12" cy="10" r="3"/><path d="M7 18.5c1-3 3-4.2 5-4.2s4 1.2 5 4.2"/></svg><span>Profile</span></button>
  </nav>
</div>

<div class="backdrop" id="backdrop"></div>

<div class="sheet" id="sheet">
  <div class="sheet-handle"><div></div></div>
  <button class="sheet-close" id="sheetClose" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  <div id="sheetContent"></div>
</div>

<div class="fsheet" id="fsheet">
  <div class="fsheet-head">
    <div class="bar"></div>
    <div class="row"><h2>Filters</h2><button id="clearF">Clear all</button></div>
  </div>
  <div id="fbody"></div>
  <div class="fsheet-cta"><button class="btn btn-primary" id="applyF">Show profiles</button></div>
</div>

<div class="confirm" id="confirm">
  <div class="confirm-box">
    <div class="shellwrap">
      <svg viewBox="0 0 96 96">
        <path class="valve-l" d="M48 80 C 20 73, 13 42, 27 20" stroke="#2C6E75" stroke-width="7" fill="none" stroke-linecap="round"/>
        <path class="valve-r" d="M48 80 C 76 73, 83 42, 69 20" stroke="#1E3548" stroke-width="7" fill="none" stroke-linecap="round"/>
        <circle class="pearl-pop" cx="48" cy="42" r="9" fill="#F4633A"/>
      </svg>
    </div>
    <h3 id="cTitle">Interest sent</h3>
    <p id="cText"></p>
    <button class="btn btn-primary" id="cClose">Keep looking</button>
  </div>
</div>

<div class="toast" id="toast"><span class="pearl"></span><span id="toastText"></span></div>

<script>
const P = n => `https://randomuser.me/api/portraits/women/${n}.jpg`;

const profiles=[
{id:1,name:'Priya Shimpi',age:26,height:"5'4\"",city:'Pune',new:true,verified:true,
 pics:[P(44),P(65),P(90),P(21)],
 edu:'M.Com',job:'Chartered Accountant',income:'₹8–12 L',
 facts:[['edu','M.Com'],['job','CA at Deloitte'],['loc','Pune']],
 prompt:{q:'A Sunday at my home looks like',a:"Filter coffee, my mother's cooking playing second fiddle to her opinions, and me pretending to help."},
 prompts:[{q:'A Sunday at my home looks like',a:"Filter coffee, my mother's cooking playing second fiddle to her opinions, and me pretending to help."},{q:'In marriage, my one non-negotiable is',a:'That we can disagree out loud without it becoming a three-day silence.'},{q:'My family teases me about',a:'Reading three books at once and finishing none of them.'}],
 compat:[{yes:1,t:'Both prefer a nuclear setup',s:'You both chose this in your preferences'},{yes:1,t:'Both value career growth',s:'Similar answers on work–life priorities'},{yes:0,t:'Different on relocation',s:"She prefers to stay in Pune; you're open to moving"}],
 family:{father:'Retired bank manager',mother:'Homemaker',siblings:'1 younger brother',type:'Nuclear',native:'Nashik'},
 life:{diet:'Vegetarian',horoscope:'Flexible',relocate:'Prefers Pune',lang:'Marathi, Hindi, English'},
 about:'I audit for a living, which means I notice details — including the good ones. Looking for someone steady and funny, who has their own thing going on and lets me have mine.'},

{id:2,name:'Anjali Shimpi',age:24,height:"5'2\"",city:'Chh. Sambhajinagar',new:true,verified:true,
 pics:[P(68),P(33),P(12)],
 edu:'B.Arch',job:'Architect',income:'₹5–8 L',

const sent=new Set(), saved=new Set();

const filters={
  age:['22–26','26–30','30+'],
  city:['Chh. Sambhajinagar','Pune','Nashik','Jalna','Mumbai'],
  edu:['Graduate','Post-graduate','Professional'],
  family:['Nuclear','Joint','No preference'],
  diet:['Vegetarian','Non-vegetarian','No preference']
};
const fLabels={age:'Age',city:'City',edu:'Education',family:'Family type',diet:'Diet'};
const active={};

function cardHTML(p){
 return `<article class="card" data-id="${p.id}">
  <div class="card-photo">
    <img src="${p.pics[0]}" alt="" loading="lazy">
    ${p.new?'<span class="new-badge">New</span>':''}
    <span class="photo-count">1 / ${p.pics.length}</span>
    <div class="photo-body">
      <div class="photo-name">${p.name.split(' ')[0]}, ${p.age} ${p.verified?ic.verified:''}</div>
      <div class="photo-sub">${p.height} · ${p.city}</div>
    </div>
  </div>
  <div class="card-body">
    <div class="facts">${p.facts.map(f=>`<span class="fact">${ic[f[0]]}${f[1]}</span>`).join('')}</div>
    <div class="prompt"><div class="q">${p.prompt.q}</div><div class="a">${p.prompt.a}</div></div>
    <div class="compat">${p.compat.map(c=>`<span class="compat-chip ${c.yes?'match':'diff'}">${c.yes?ic.check:ic.minus}${c.t}</span>`).join('')}</div>
  </div>
  <div class="card-actions">
    <button class="btn btn-ghost ${saved.has(p.id)?'saved':''}" data-act="save" aria-label="Shortlist">${ic.bookmark}</button>
    <button class="btn btn-primary ${sent.has(p.id)?'sent':''}" data-act="interest">${ic.heart}${sent.has(p.id)?'Interest sent':'Express Interest'}</button>
  </div>
 </article>`;
}

function sheetHTML(p){
 return `
 <div class="gallery">
   <div class="gallery-track" id="gtrack">${p.pics.map(s=>`<img src="${s}" alt="">`).join('')}</div>
   <div class="dots" id="gdots">${p.pics.map((_,i)=>`<span class="dot ${i===0?'on':''}"></span>`).join('')}</div>
   <div class="gallery-info">
     <div class="photo-name">${p.name}, ${p.age} ${p.verified?ic.verified:''}</div>
     <div class="photo-sub">${p.height} · ${p.city} · ${p.edu}</div>
   </div>
 </div>
 <div class="sheet-section"><h3>${ic.quote} In her words</h3><p class="about-text">${p.about}</p></div>
 <div class="sheet-section"><h3>${ic.spark} Why you might fit</h3>
   ${p.compat.map(c=>`<div class="compat-row"><div class="compat-icon ${c.yes?'yes':'no'}">${c.yes?ic.check:ic.minus}</div><div class="compat-text"><div class="t">${c.t}</div><div class="s">${c.s}</div></div></div>`).join('')}
 </div>
 <div class="sheet-section"><h3>${ic.quote} Prompts</h3>
   ${p.prompts.map(q=>`<div class="prompt-block"><div class="q">${q.q}</div><div class="a">${q.a}</div></div>`).join('')}
 </div>
 <div class="sheet-section"><h3>${ic.job} Education &amp; work</h3>
   <div class="detail-grid">
     <div class="detail"><div class="k">Education</div><div class="v">${p.edu}</div></div>
     <div class="detail"><div class="k">Occupation</div><div class="v">${p.job}</div></div>
     <div class="detail"><div class="k">Income band</div><div class="v">${p.income}</div></div>
     <div class="detail"><div class="k">Location</div><div class="v">${p.city}</div></div>
   </div>
 </div>
 <div class="sheet-section"><h3>${ic.family} Family</h3>
   <div class="detail-grid">
     <div class="detail"><div class="k">Father</div><div class="v">${p.family.father}</div></div>
     <div class="detail"><div class="k">Mother</div><div class="v">${p.family.mother}</div></div>
     <div class="detail"><div class="k">Siblings</div><div class="v">${p.family.siblings}</div></div>
     <div class="detail"><div class="k">Family type</div><div class="v">${p.family.type}</div></div>
     <div class="detail full"><div class="k">Native place</div><div class="v">${p.family.native}</div></div>
   </div>
 </div>
 <div class="sheet-section"><h3>${ic.life} Lifestyle</h3>
   <div class="detail-grid">
     <div class="detail"><div class="k">Diet</div><div class="v">${p.life.diet}</div></div>
     <div class="detail"><div class="k">Horoscope</div><div class="v">${p.life.horoscope}</div></div>
     <div class="detail"><div class="k">Relocation</div><div class="v">${p.life.relocate}</div></div>
     <div class="detail"><div class="k">Languages</div><div class="v">${p.life.lang}</div></div>
   </div>
 </div>
 <div class="locked-note">${ic.lock}<div>Contact details and chat open once <b>she accepts your interest</b>.</div></div>
 <div class="sheet-cta">
   <button class="btn btn-ghost ${saved.has(p.id)?'saved':''}" data-act="save">${ic.bookmark}</button>
   <button class="btn btn-primary ${sent.has(p.id)?'sent':''}" data-act="interest" data-id="${p.id}">${ic.heart}${sent.has(p.id)?'Interest sent':'Express Interest'}</button>
 </div>`;
}

const feed=document.getElementById('feed'),sheet=document.getElementById('sheet'),
 backdrop=document.getElementById('backdrop'),sheetContent=document.getElementById('sheetContent'),
 toast=document.getElementById('toast'),toastText=document.getElementById('toastText'),
 fsheet=document.getElementById('fsheet'),confirm=document.getElementById('confirm');

function render(){
  feed.innerHTML = profiles.map(cardHTML).join('') +
   `<div class="feed-end">
      <svg viewBox="0 0 96 96"><path d="M48 78 C 26 72, 20 48, 30 30" stroke="#C9C3B9" stroke-width="6" fill="none" stroke-linecap="round"/><path d="M48 78 C 70 72, 76 48, 66 30" stroke="#C9C3B9" stroke-width="6" fill="none" stroke-linecap="round"/></svg>
      <p>That's today's five.<br>New profiles every morning at 8.</p>
    </div>`;
}
render();

function showToast(m){toastText.textContent=m;toast.classList.add('show');clearTimeout(showToast._t);showToast._t=setTimeout(()=>toast.classList.remove('show'),2200);}

function openSheet(p){
  sheetContent.innerHTML=sheetHTML(p);
  sheet.classList.add('open');backdrop.classList.add('open');sheet.scrollTop=0;
  document.body.style.overflow='hidden';
  const track=document.getElementById('gtrack'),dots=document.getElementById('gdots');
  if(track){track.addEventListener('scroll',()=>{
    const i=Math.round(track.scrollLeft/track.clientWidth);
    [...dots.children].forEach((d,j)=>d.classList.toggle('on',j===i));
  });}
}
function closeAll(){
  sheet.classList.remove('open');fsheet.classList.remove('open');backdrop.classList.remove('open');
  document.body.style.overflow='';
}

function sendInterest(p){
  sent.add(p.id);render();
  document.getElementById('cText').textContent = `${p.name.split(' ')[0]} will see your interest. If she accepts, chat opens for both of you.`;
  confirm.classList.add('open');
}

feed.addEventListener('click',e=>{
  const card=e.target.closest('.card');if(!card)return;
  const id=+card.dataset.id,p=profiles.find(x=>x.id===id),act=e.target.closest('[data-act]');
  if(act){
    e.stopPropagation();
    if(act.dataset.act==='interest'){ if(sent.has(id)){showToast('Interest already sent');return;} sendInterest(p); }
    else { saved.has(id)?saved.delete(id):saved.add(id); render(); showToast(saved.has(id)?'Saved to shortlist':'Removed from shortlist'); }
    return;
  }
  openSheet(p);
});

sheetContent.addEventListener('click',e=>{
  const act=e.target.closest('[data-act]');if(!act)return;
  if(act.dataset.act==='interest'){
    const id=+act.dataset.id,p=profiles.find(x=>x.id===id);
    if(sent.has(id)){showToast('Interest already sent');return;}
    act.classList.add('sent');act.innerHTML=ic.heart+'Interest sent';
    sendInterest(p);
  } else { showToast('Saved to shortlist'); act.classList.add('saved'); }
});

// filters
function renderFilters(){
  document.getElementById('fbody').innerHTML=Object.keys(filters).map(k=>`
    <div class="fgroup"><h4>${fLabels[k]}</h4>
      <div class="chiprow">${filters[k].map(v=>`<button class="fchip ${active[k]===v?'on':''}" data-k="${k}" data-v="${v}">${v}</button>`).join('')}</div>
    </div>`).join('');
}
renderFilters();
document.getElementById('fbody').addEventListener('click',e=>{
  const c=e.target.closest('.fchip');if(!c)return;
  const k=c.dataset.k,v=c.dataset.v;
  active[k]===v?delete active[k]:active[k]=v;
  renderFilters();updateCount();
});
function updateCount(){
  const n=Object.keys(active).length,b=document.getElementById('fCount');
  b.style.display=n?'flex':'none';b.textContent=n;
}
document.getElementById('filterBtn').onclick=()=>{fsheet.classList.add('open');backdrop.classList.add('open');document.body.style.overflow='hidden';};
document.getElementById('clearF').onclick=()=>{Object.keys(active).forEach(k=>delete active[k]);renderFilters();updateCount();};
document.getElementById('applyF').onclick=()=>{closeAll();const n=Object.keys(active).length;showToast(n?`${n} filter${n>1?'s':''} applied`:'Filters cleared');};

document.getElementById('sheetClose').onclick=closeAll;
backdrop.onclick=closeAll;
document.getElementById('cClose').onclick=()=>confirm.classList.remove('open');
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeAll();confirm.classList.remove('open');}});
</script>
</body>
</html>
